{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <h2 class="fw-bold mb-4">Create your account</h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    minlength="8"
                    required
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    I am applying as...
                </label>

                <select
                    name="role"
                    class="form-select"
                    required
                >

                    <option value="hacker">
                        Hacker
                    </option>

                    <option value="volunteer">
                        Volunteer
                    </option>

                </select>

            </div>


            <button class="btn btn-dark w-100">
                Create account
            </button>

        </form>

    </div>

</div>

{% endblock %}
