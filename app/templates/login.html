{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <h2 class="fw-bold mb-4">
            Welcome back
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                >

            </div>


            <button class="btn btn-dark w-100">
                Log in
            </button>

        </form>

    </div>

</div>

{% endblock %}
